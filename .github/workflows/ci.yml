name: LocalRAG CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localrag-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Start integration services
        working-directory: .
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            up -d qdrant ollama

      - name: Wait for Qdrant
        run: |
          for i in {1..60}; do
            STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' localrag-qdrant 2>/dev/null || true)

            echo "Qdrant container health: ${STATUS:-unknown}"

            if [ "$STATUS" = "healthy" ]; then
              echo "Qdrant is healthy"
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "Qdrant failed to become healthy"
              docker inspect localrag-qdrant --format='{{json .State}}'
              docker logs localrag-qdrant
              exit 1
            fi

            sleep 2
          done

      - name: Verify Qdrant port
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            port qdrant 6333

          python - <<'PY'
          import socket
          import sys

          host = "127.0.0.1"
          port = 6333

          with socket.create_connection((host, port), timeout=10):
              print(f"Qdrant TCP port {host}:{port} is reachable")
          PY

      - name: Wait for Ollama
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready"
              exit 0
            fi

            echo "Waiting for Ollama..."
            sleep 2
          done

          echo "Ollama failed to become ready"
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            logs ollama

          exit 1

      - name: Pull embedding model
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            exec -T ollama \
            ollama pull nomic-embed-text

      - name: Run API tests
        working-directory: apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api
          QDRANT_HOST: 127.0.0.1
          QDRANT_PORT: "6333"
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          EMBEDDING_MODEL: nomic-embed-text
          LLM_MODEL: llama3.2:3b
        run: |
          pytest -q

      - name: Show integration service logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            logs qdrant ollama

      - name: Stop integration services
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f .github/ci-compose.yml \
            down -v

  web-build:
    name: Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web lint
        working-directory: apps/web
        run: npm run lint

      - name: Build web application
        working-directory: apps/web
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - api-tests
      - web-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: localrag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: localrag-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max