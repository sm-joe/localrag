name: LocalRAG CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localrag-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest

    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      ci: ${{ steps.filter.outputs.ci }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'ollama/**'
              - 'docker-compose.yml'
              - '.github/ci-compose.yml'

            ci:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'docker-compose.yml'
              - '.github/**'
              - 'tests/**'
              - 'evals/**'
              - 'packages/**'
              - 'Makefile'
              
  gitleaks:
    name: Security - Gitleaks
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: Security - CodeQL
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    permissions:
      security-events: write
      actions: read
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  trivy-config:
    name: Security - Trivy Config
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Scan Repository Configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  api-tests:
    name: API Tests
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    env:
      COMPOSE: docker compose -f docker-compose.yml -f .github/ci-compose.yml

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Start Integration Services
        run: |
          $COMPOSE up -d --wait qdrant ollama

      - name: Run API Tests
        run: |
          $COMPOSE run --rm --build api pytest -q

      - name: Show Service Logs On Failure
        if: failure()
        run: |
          $COMPOSE logs --no-color qdrant ollama-init ollama api
          
      - name: Stop Integration Services
        if: always()
        run: |
          $COMPOSE down -v

  web-build:
    name: Web Build
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci

      - name: Run Web Lint
        run: npm run lint

      - name: Build Web Application
        run: npm run build

  docker-build:
    name: Docker Build
    if: |
      needs.changes.outputs.docker == 'true' &&
      (
        needs.gitleaks.result == 'success' ||
        needs.gitleaks.result == 'skipped'
      ) &&
      (
        needs.codeql.result == 'success' ||
        needs.codeql.result == 'skipped'
      ) &&
      (
        needs.trivy-config.result == 'success' ||
        needs.trivy-config.result == 'skipped'
      ) &&
      (
        needs.api-tests.result == 'success' ||
        needs.api-tests.result == 'skipped'
      ) &&
      (
        needs.web-build.result == 'success' ||
        needs.web-build.result == 'skipped'
      )
    runs-on: ubuntu-latest

    needs:
      - changes
      - gitleaks
      - codeql
      - trivy-config
      - api-tests
      - web-build
    
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          load: true
          tags: localrag-api:ci
          cache-from: type=gha,scope=localrag-api
          cache-to: type=gha,scope=localrag-api,mode=max

      - name: Scan API Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: localrag-api:ci
          format: sarif
          output: trivy-api-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload API Trivy Results
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api-results.sarif
          category: trivy-container-api

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          load: true
          tags: localrag-web:ci
          cache-from: type=gha,scope=localrag-web
          cache-to: type=gha,scope=localrag-web,mode=max

      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: localrag-web:ci
          format: sarif
          output: trivy-web-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Web Trivy Results
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-web-results.sarif
          category: trivy-container-web