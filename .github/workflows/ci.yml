name: LocalRAG CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localrag-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Start Integration Services
        run: |
          docker compose -f docker-compose.yml -f .github/ci-compose.yml up -d qdrant ollama

      - name: Wait for Qdrant
        run: |
          for i in {1..60}; do
            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
              localrag-qdrant 2>/dev/null || true)

            echo "Qdrant health: ${STATUS:-unknown}"

            if [ "$STATUS" = "healthy" ]; then
              echo "Qdrant is healthy"
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "Qdrant failed to become healthy"
              docker logs localrag-qdrant
              exit 1
            fi

            sleep 2
          done

      - name: Wait for Ollama
        run: |
          for i in {1..60}; do
            if docker compose \
              -f docker-compose.yml \
              -f .github/ci-compose.yml \
              exec -T ollama \
              sh -c 'wget -q -O /dev/null http://127.0.0.1:11434/api/tags'; then
              echo "Ollama API is ready"
              break
            fi

            echo "Ollama API not ready yet ($i/60)"

            if [ "$i" -eq 60 ]; then
              echo "Ollama failed to become ready"
              docker logs localrag-ollama
              exit 1
            fi

            sleep 2
          done

      - name: Pull embedding model
        run: |
          docker run --rm --network host ollama/ollama:latest pull nomic-embed-text

      
      - name: Run API Tests Inside Compose Network
        run: |
          docker compose -f docker-compose.yml -f .github/ci-compose.yml run --rm api pytest -q

      - name: Show Service Logs On Failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f .github/ci-compose.yml logs --no-color qdrant ollama api
          
      - name: Stop Integration Services
        if: always()
        run: |
          docker compose -f docker-compose.yml -f .github/ci-compose.yml down -v

  web-build:
    name: Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Web Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build Web Application
        working-directory: apps/web
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - api-tests
      - web-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: localrag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: localrag-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max