name: LocalRAG CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localrag-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Security - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: Security - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read
    
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest

    outputs:
      docker: ${{ steps.filter.outputs.docker }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docker:
              - 'apps/api/Dockerfile'
              - 'apps/api/requirements.txt'
              - 'apps/api/app/**'
              - 'apps/web/Dockerfile'
              - 'apps/web/package.json'
              - 'apps/web/package-lock.json'
              - 'apps/web/**'
              - 'docker-compose.yml'
              - '.github/ci-compose.yml'

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install API Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-asyncio

      - name: Start Integration Services
        run: |
          docker compose -f docker-compose.yml -f .github/ci-compose.yml up -d --wait qdrant ollama

      - name: Wait for Qdrant
        run: |
          for i in {1..60}; do
            STATUS=$(docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
              localrag-qdrant 2>/dev/null || true)

            echo "Qdrant health: ${STATUS:-unknown}"

            if [ "$STATUS" = "healthy" ]; then
              echo "Qdrant is healthy"
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "Qdrant failed to become healthy"
              docker logs localrag-qdrant
              exit 1
            fi

            sleep 2
          done

      - name: Pull embedding model
        run: |
          docker compose -f docker-compose.yml -f .github/ci-compose.yml exec -T ollama ollama pull nomic-embed-text

      
      - name: Run API Tests Inside Compose Network
        run: |
          docker compose -f docker-compose.yml -f .github/ci-compose.yml run --rm --build api pytest -q

      - name: Show Service Logs On Failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f .github/ci-compose.yml logs --no-color qdrant ollama api
          
      - name: Stop Integration Services
        if: always()
        run: |
          docker compose -f docker-compose.yml -f .github/ci-compose.yml down -v

  web-build:
    name: Web Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Web Lint
        working-directory: apps/web
        run: npm run lint

      - name: Build Web Application
        working-directory: apps/web
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: needs.changes.outputs.docker == 'true'
    needs:
      - changes
      - api-tests
      - web-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: localrag-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan API Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: localrag-api:ci
          format: sarif
          output: trivy-api-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload API Trivy Results to Code Scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api-results.sarif
          category: trivy-container-api

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: localrag-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Web Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          image-ref: localrag-web:ci
          format: sarif
          output: trivy-web-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Web Trivy Results to Code Scanning
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-web-results.sarif
          category: trivy-container-web