services:
  qdrant:
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-ci-data:/qdrant/storage

  ollama:
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-ci-data:/root/.ollama
    networks:
      - backend
      - ci-egress
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  ci-egress:
    driver: bridge

volumes:
  qdrant-ci-data:
  ollama-ci-data: