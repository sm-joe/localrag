services:
  qdrant:
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-ci-data:/qdrant/storage

  ollama:
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ollama-ci-data:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  qdrant-ci-data:
  ollama-ci-data: