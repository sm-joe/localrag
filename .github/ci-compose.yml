services:
  qdrant:
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-ci-data:/qdrant/storage

  ollama:
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-ci-data:/root/.ollama

volumes:
  qdrant-ci-data:
  ollama-ci-data: