services:
  api:
    build:
      context: ./apps/api
    container_name: localrag-api
    restart: unless-stopped
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    networks:
      - frontend
      - backend
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started

  web:
    build:
      context: ./apps/web
    container_name: localrag-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    networks:
      - frontend
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: localrag-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.35.1
    container_name: localrag-ollama-init
    restart: "no"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /opt/ollama-models
    volumes:
      - ollama_models:/opt/ollama-models
    networks:
      - ollama-egress
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        ollama serve >/tmp/ollama-init.log 2>&1 &
        OLLAMA_PID=$!

        trap 'kill "$${OLLAMA_PID}" 2>/dev/null || true' EXIT

        until ollama list >/dev/null 2>&1; do
          if ! kill -0 "$${OLLAMA_PID}" 2>/dev/null; then
            cat /tmp/ollama-init.log
            exit 1
          fi
          sleep 2
        done

        ollama pull nomic-embed-text
        ollama pull llama3.2:3b

ollama:
  build:
    context: ./ollama
    container_name: localrag-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /opt/ollama-models
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama_models:/opt/ollama-models
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

  ollama-egress:
    driver: bridge

volumes:
  qdrant_data:
  ollama_models: