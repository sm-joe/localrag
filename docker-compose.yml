services:
  api:
    build:
      context: ./apps/api
    container_name: localrag-api
    restart: unless-stopped
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    networks:
      - frontend
      - backend
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started

  web:
    build:
      context: ./apps/web
    container_name: localrag-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    networks:
      - frontend
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: localrag-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    build:
      context: ./ollama
    container_name: localrag-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /opt/ollama-models
      OLLAMA_ORIGINS: "*"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge
    internal: true

volumes:
  qdrant_data: